<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found — Noria</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta name="theme-color" content="#fbf7f2" />
    <!-- Standalone page: it carries its own styles and loads no bundle.
         Colours mirror the storefront tokens in src/styles/store.css. -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1.5rem;
        text-align: center;
        color: #222222;
        background-color: #fbf7f2;
        font-family:
          "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 5vw, 2rem);
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 36ch;
        line-height: 1.5;
        color: #767676;
      }
      a {
        margin-top: 0.5rem;
        padding: 0.7rem 1.4rem;
        border: 1px solid #1f3b33;
        border-radius: 999px;
        background: #1f3b33;
        color: #f5efdf;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: #2f4a3c;
        border-color: #2f4a3c;
      }
    </style>
  </head>
  <body>
    <img src="/assets/favicon.svg" alt="" />
    <h1>This page does not exist</h1>

      The link may be mistyped or out of date. The poster editor is still right

    </p>
